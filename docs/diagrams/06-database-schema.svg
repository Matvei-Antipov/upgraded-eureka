<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 780" width="1220" height="780" font-family="Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="er-one" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <line x1="6" y1="1" x2="6" y2="11" stroke="#111827" stroke-width="1.8"/>
      <line x1="2" y1="1" x2="2" y2="11" stroke="#111827" stroke-width="1.8"/>
    </marker>
    <marker id="er-many" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 1 7 L 13 1 M 1 7 L 13 7 M 1 7 L 13 13" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="1" y1="2" x2="1" y2="12" stroke="#111827" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1220" height="780" fill="#ffffff"/>
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="320" height="270" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="38" rx="6" ry="6" fill="#111827"/>
    <text x="160" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">users</text>
    <text x="14" y="62" font-size="12" font-weight="700" fill="#b45309">PK</text>
    <text x="48" y="62" font-size="12.5" font-weight="700" fill="#111827">id</text>
    <text x="306" y="62" font-size="11.5" text-anchor="end" fill="#4b5563">INT AUTO_INCREMENT</text>
    <line x1="0" y1="72" x2="320" y2="72" stroke="#e5e7eb" stroke-width="1"/>

    <text x="14" y="94" font-size="11" font-weight="700" fill="#2563eb">UQ</text>
    <text x="48" y="94" font-size="12.5" font-weight="600" fill="#111827">login</text>
    <text x="306" y="94" font-size="11.5" text-anchor="end" fill="#4b5563">VARCHAR(255) NOT NULL</text>

    <text x="48" y="120" font-size="12.5" fill="#111827">password</text>
    <text x="306" y="120" font-size="11.5" text-anchor="end" fill="#4b5563">VARCHAR(255) NOT NULL</text>

    <text x="48" y="146" font-size="12.5" fill="#111827">full_name</text>
    <text x="306" y="146" font-size="11.5" text-anchor="end" fill="#4b5563">VARCHAR(255) NOT NULL</text>

    <text x="14" y="172" font-size="11" font-weight="700" fill="#2563eb">UQ</text>
    <text x="48" y="172" font-size="12.5" font-weight="600" fill="#111827">email</text>
    <text x="306" y="172" font-size="11.5" text-anchor="end" fill="#4b5563">VARCHAR(255) NOT NULL</text>

    <text x="48" y="198" font-size="12.5" fill="#111827">profile_picture</text>
    <text x="306" y="198" font-size="11.5" text-anchor="end" fill="#4b5563">VARCHAR(255) DEFAULT</text>

    <text x="48" y="224" font-size="12.5" fill="#111827">rating</text>
    <text x="306" y="224" font-size="11.5" text-anchor="end" fill="#4b5563">INT DEFAULT 0</text>

    <text x="48" y="250" font-size="12.5" fill="#111827">role</text>
    <text x="306" y="250" font-size="11.5" text-anchor="end" fill="#4b5563">ENUM('admin','user')</text>
  </g>
  <g transform="translate(465, 50)">
    <rect x="0" y="0" width="320" height="225" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="38" rx="6" ry="6" fill="#111827"/>
    <text x="160" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">posts</text>

    <text x="14" y="62" font-size="12" font-weight="700" fill="#b45309">PK</text>
    <text x="48" y="62" font-size="12.5" font-weight="700" fill="#111827">id</text>
    <text x="306" y="62" font-size="11.5" text-anchor="end" fill="#4b5563">INT AUTO_INCREMENT</text>
    <line x1="0" y1="72" x2="320" y2="72" stroke="#e5e7eb" stroke-width="1"/>

    <text x="14" y="96" font-size="12" font-weight="700" fill="#047857">FK</text>
    <text x="48" y="96" font-size="12.5" font-weight="600" fill="#111827">author_id</text>
    <text x="306" y="96" font-size="11.5" text-anchor="end" fill="#4b5563">INT NOT NULL → users.id</text>

    <text x="48" y="124" font-size="12.5" fill="#111827">title</text>
    <text x="306" y="124" font-size="11.5" text-anchor="end" fill="#4b5563">VARCHAR(255) NOT NULL</text>

    <text x="48" y="152" font-size="12.5" fill="#111827">publish_date</text>
    <text x="306" y="152" font-size="11.5" text-anchor="end" fill="#4b5563">TIMESTAMP DEFAULT NOW()</text>

    <text x="48" y="180" font-size="12.5" fill="#111827">status</text>
    <text x="306" y="180" font-size="11.5" text-anchor="end" fill="#4b5563">ENUM('active','inactive')</text>

    <text x="48" y="208" font-size="12.5" fill="#111827">content</text>
    <text x="306" y="208" font-size="11.5" text-anchor="end" fill="#4b5563">TEXT NOT NULL</text>
  </g>
  <g transform="translate(875, 50)">
    <rect x="0" y="0" width="300" height="135" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="38" rx="6" ry="6" fill="#1f2937"/>
    <text x="150" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">post_categories (M:N)</text>

    <text x="12" y="64" font-size="11.5" font-weight="700" fill="#b45309">PK,FK</text>
    <text x="58" y="64" font-size="12.5" font-weight="700" fill="#111827">post_id</text>
    <text x="286" y="64" font-size="11.5" text-anchor="end" fill="#4b5563">INT → posts.id</text>
    <line x1="0" y1="76" x2="300" y2="76" stroke="#e5e7eb" stroke-width="1"/>

    <text x="12" y="104" font-size="11.5" font-weight="700" fill="#b45309">PK,FK</text>
    <text x="58" y="104" font-size="12.5" font-weight="700" fill="#111827">category_id</text>
    <text x="286" y="104" font-size="11.5" text-anchor="end" fill="#4b5563">INT → categories.id</text>
  </g>
  <g transform="translate(875, 265)">
    <rect x="0" y="0" width="300" height="150" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="38" rx="6" ry="6" fill="#111827"/>
    <text x="150" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">categories</text>

    <text x="14" y="62" font-size="12" font-weight="700" fill="#b45309">PK</text>
    <text x="48" y="62" font-size="12.5" font-weight="700" fill="#111827">id</text>
    <text x="286" y="62" font-size="11.5" text-anchor="end" fill="#4b5563">INT AUTO_INCREMENT</text>
    <line x1="0" y1="72" x2="300" y2="72" stroke="#e5e7eb" stroke-width="1"/>

    <text x="48" y="98" font-size="12.5" font-weight="600" fill="#111827">title</text>
    <text x="286" y="98" font-size="11.5" text-anchor="end" fill="#4b5563">VARCHAR(255) NOT NULL</text>

    <text x="48" y="126" font-size="12.5" fill="#111827">description</text>
    <text x="286" y="126" font-size="11.5" text-anchor="end" fill="#4b5563">TEXT</text>
  </g>
  <g transform="translate(465, 425)">
    <rect x="0" y="0" width="320" height="225" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="38" rx="6" ry="6" fill="#111827"/>
    <text x="160" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">comments</text>

    <text x="14" y="62" font-size="12" font-weight="700" fill="#b45309">PK</text>
    <text x="48" y="62" font-size="12.5" font-weight="700" fill="#111827">id</text>
    <text x="306" y="62" font-size="11.5" text-anchor="end" fill="#4b5563">INT AUTO_INCREMENT</text>
    <line x1="0" y1="72" x2="320" y2="72" stroke="#e5e7eb" stroke-width="1"/>

    <text x="14" y="96" font-size="12" font-weight="700" fill="#047857">FK</text>
    <text x="48" y="96" font-size="12.5" font-weight="600" fill="#111827">author_id</text>
    <text x="306" y="96" font-size="11.5" text-anchor="end" fill="#4b5563">INT NOT NULL → users.id</text>

    <text x="14" y="124" font-size="12" font-weight="700" fill="#047857">FK</text>
    <text x="48" y="124" font-size="12.5" font-weight="600" fill="#111827">post_id</text>
    <text x="306" y="124" font-size="11.5" text-anchor="end" fill="#4b5563">INT NOT NULL → posts.id</text>

    <text x="48" y="152" font-size="12.5" fill="#111827">publish_date</text>
    <text x="306" y="152" font-size="11.5" text-anchor="end" fill="#4b5563">TIMESTAMP DEFAULT NOW()</text>

    <text x="48" y="180" font-size="12.5" fill="#111827">content</text>
    <text x="306" y="180" font-size="11.5" text-anchor="end" fill="#4b5563">TEXT NOT NULL</text>

    <text x="48" y="208" font-size="12.5" fill="#111827">status</text>
    <text x="306" y="208" font-size="11.5" text-anchor="end" fill="#4b5563">ENUM('active','inactive')</text>
  </g>
  <g transform="translate(50, 425)">
    <rect x="0" y="0" width="320" height="255" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="38" rx="6" ry="6" fill="#111827"/>
    <text x="160" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">likes (Polymorphic)</text>

    <text x="14" y="62" font-size="12" font-weight="700" fill="#b45309">PK</text>
    <text x="48" y="62" font-size="12.5" font-weight="700" fill="#111827">id</text>
    <text x="306" y="62" font-size="11.5" text-anchor="end" fill="#4b5563">INT AUTO_INCREMENT</text>
    <line x1="0" y1="72" x2="320" y2="72" stroke="#e5e7eb" stroke-width="1"/>

    <text x="14" y="96" font-size="12" font-weight="700" fill="#047857">FK</text>
    <text x="48" y="96" font-size="12.5" font-weight="600" fill="#111827">author_id</text>
    <text x="306" y="96" font-size="11.5" text-anchor="end" fill="#4b5563">INT NOT NULL → users.id</text>

    <text x="48" y="124" font-size="12.5" fill="#111827">publish_date</text>
    <text x="306" y="124" font-size="11.5" text-anchor="end" fill="#4b5563">TIMESTAMP DEFAULT NOW()</text>

    <text x="14" y="152" font-size="12" font-weight="700" fill="#047857">FK</text>
    <text x="48" y="152" font-size="12.5" font-weight="600" fill="#111827">post_id</text>
    <text x="306" y="152" font-size="11.5" text-anchor="end" fill="#4b5563">INT NULL → posts.id</text>

    <text x="14" y="180" font-size="12" font-weight="700" fill="#047857">FK</text>
    <text x="48" y="180" font-size="12.5" font-weight="600" fill="#111827">comment_id</text>
    <text x="306" y="180" font-size="11.5" text-anchor="end" fill="#4b5563">INT NULL → comments.id</text>

    <text x="48" y="208" font-size="12.5" font-weight="600" fill="#111827">type</text>
    <text x="306" y="208" font-size="11.5" text-anchor="end" fill="#4b5563">ENUM('like','dislike')</text>

    <rect x="10" y="220" width="300" height="25" rx="4" ry="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="160" y="237" font-size="10.5" font-weight="600" text-anchor="middle" fill="#92400e">
      CHECK: (post_id IS NOT NULL XOR comment_id IS NOT NULL)
    </text>
  </g>
  <line x1="370" y1="142" x2="463" y2="142" stroke="#111827" stroke-width="1.8" marker-start="url(#er-one)" marker-end="url(#er-many)"/>
  <text x="416" y="132" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">1 : N</text>
  <line x1="785" y1="110" x2="873" y2="110" stroke="#111827" stroke-width="1.8" marker-start="url(#er-one)" marker-end="url(#er-many)"/>
  <text x="829" y="100" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">1 : N</text>
  <line x1="1025" y1="265" x2="1025" y2="187" stroke="#111827" stroke-width="1.8" marker-start="url(#er-one)" marker-end="url(#er-many)"/>
  <text x="1050" y="230" font-size="11" font-weight="700" fill="#111827">1 : N</text>
  <line x1="625" y1="275" x2="625" y2="423" stroke="#111827" stroke-width="1.8" marker-start="url(#er-one)" marker-end="url(#er-many)"/>
  <text x="650" y="355" font-size="11" font-weight="700" fill="#111827">1 : N</text>
  <line x1="210" y1="320" x2="210" y2="423" stroke="#111827" stroke-width="1.8" marker-start="url(#er-one)" marker-end="url(#er-many)"/>
  <text x="235" y="375" font-size="11" font-weight="700" fill="#111827">1 : N</text>
  <polyline points="370,260 418,260 418,518 463,518" fill="none" stroke="#111827" stroke-width="1.6" marker-start="url(#er-one)" marker-end="url(#er-many)"/>
  <text x="436" y="405" font-size="11" font-weight="700" fill="#111827">1 : N</text>
  <polyline points="465,235 395,235 395,575 372,575" fill="none" stroke="#111827" stroke-width="1.6" marker-start="url(#er-one)" marker-end="url(#er-many)"/>
  <line x1="465" y1="605" x2="372" y2="605" stroke="#111827" stroke-width="1.8" marker-start="url(#er-one)" marker-end="url(#er-many)"/>
  <text x="418" y="622" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">1 : N</text>
  <g transform="translate(875, 465)">
    <rect x="0" y="0" width="300" height="215" rx="6" ry="6" fill="#f9fafb" stroke="#111827" stroke-width="1.5"/>
    <text x="16" y="28" font-size="13" font-weight="700" fill="#111827">Особливості схеми БД USOF:</text>
    <text x="16" y="54" font-size="11.5" fill="#1f2937">• Усі зовнішні ключі (FK) мають</text>
    <text x="24" y="72" font-size="11.5" font-weight="600" fill="#111827">ON DELETE CASCADE</text>
    <text x="16" y="96" font-size="11.5" fill="#1f2937">• Таблиця post_categories реалізує</text>
    <text x="24" y="114" font-size="11.5" fill="#1f2937">зв'язок M:N між posts і categories</text>
    <text x="16" y="138" font-size="11.5" fill="#1f2937">• Таблиця likes є поліморфною:</text>
    <text x="24" y="156" font-size="11.5" fill="#1f2937">оцінка стосується або публікації</text>
    <text x="24" y="174" font-size="11.5" fill="#1f2937">(post_id), або коментаря (comment_id)</text>
    <text x="16" y="198" font-size="11.5" fill="#1f2937">• СУБД: MySQL 8.0 (InnoDB, UTF8MB4)</text>
  </g>
  <text x="610" y="742" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">
    Рисунок 6 — ER-діаграма реляційної бази даних системи USOF
  </text>
</svg>
