<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" font-family="Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <!-- Кінцевий стан (Final Node / Bullseye) -->
    <g id="final-node">
      <circle cx="0" cy="0" r="13" fill="#ffffff" stroke="#111827" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#111827"/>
    </g>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="1200" height="920" fill="#ffffff"/>

  <!-- ==================== ДОРІЖКИ (SWIMLANES) ==================== -->
  <rect x="40" y="30" width="1120" height="835" fill="none" stroke="#111827" stroke-width="2"/>
  <!-- Заголовок таблиці доріжок -->
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#111827" stroke-width="2"/>
  <!-- Вертикальні розділювачі доріжок -->
  <line x1="400" y1="30" x2="400" y2="865" stroke="#111827" stroke-width="1.8"/>
  <line x1="780" y1="30" x2="780" y2="865" stroke="#111827" stroke-width="1.8"/>

  <!-- Підписи доріжок -->
  <text x="220" y="54" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">Користувач (React UI)</text>
  <text x="590" y="54" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">Клієнтський стор (Redux + Axios)</text>
  <text x="970" y="54" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">Бекенд сервер (Express + MySQL)</text>

  <!-- ==================== КРОК 1: ПОЧАТКОВИЙ СТАН ТА КЛІК ==================== -->
  <!-- Initial Node -->
  <circle cx="220" cy="96" r="11" fill="#111827"/>
  <line x1="220" y1="107" x2="220" y2="128" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <!-- Activity 1 -->
  <rect x="95" y="130" width="250" height="44" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="220" y="156" font-size="12.5" font-weight="600" text-anchor="middle" fill="#111827">Натиснути «+ Поставити питання»</text>

  <!-- Потік до Decision 1 у другій доріжці -->
  <line x1="345" y1="152" x2="508" y2="152" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <!-- Decision 1: Авторизований? -->
  <polygon points="590,122 670,152 590,182 510,152" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="590" y="149" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">Користувач</text>
  <text x="590" y="163" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">авторизований?</text>

  <!-- Гілка [ні] -> Відкрити AuthModal -->
  <polyline points="590,182 590,218 347,218" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <text x="572" y="202" font-size="11.5" font-weight="600" fill="#111827">ні</text>

  <rect x="95" y="196" width="250" height="44" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="220" y="215" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Показати тост та відкрити</text>
  <text x="220" y="231" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">вікно входу (AuthModal)</text>

  <line x1="95" y1="218" x2="68" y2="218" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <use href="#final-node" x="53" y="218"/>

  <!-- Гілка [так] -> Відкрити AskQuestionModal та ввести дані -->
  <polyline points="670,152 705,152 705,285 347,285" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <text x="682" y="144" font-size="11.5" font-weight="600" fill="#111827">так</text>

  <rect x="95" y="263" width="250" height="46" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="220" y="283" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Ввести заголовок, текст питання</text>
  <text x="220" y="299" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">та обрати категорії</text>

  <line x1="220" y1="309" x2="220" y2="334" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <rect x="95" y="336" width="250" height="42" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="220" y="362" font-size="12.5" font-weight="600" text-anchor="middle" fill="#111827">Підтвердити публікацію форми</text>

  <!-- Потік до клієнтської валідації -->
  <line x1="345" y1="357" x2="463" y2="357" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <rect x="465" y="335" width="250" height="44" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="590" y="354" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Перевірити валідність полів</text>
  <text x="590" y="370" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">та обраних категорій</text>

  <line x1="590" y1="379" x2="590" y2="404" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <!-- Decision 2: Дані валідні? -->
  <polygon points="590,406 668,434 590,462 512,434" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="590" y="438" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Дані валідні?</text>

  <!-- Гілка [ні] -> Показати помилку валідації -->
  <line x1="512" y1="434" x2="347" y2="434" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <text x="488" y="426" font-size="11.5" font-weight="600" fill="#111827">ні</text>

  <rect x="95" y="412" width="250" height="44" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="220" y="431" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Вивести повідомлення</text>
  <text x="220" y="447" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">про помилку валідації</text>

  <line x1="95" y1="434" x2="68" y2="434" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <use href="#final-node" x="53" y="434"/>

  <!-- Гілка [так] -> Відправити POST /api/posts -->
  <line x1="590" y1="462" x2="590" y2="495" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <text x="602" y="482" font-size="11.5" font-weight="600" fill="#111827">так</text>

  <rect x="465" y="497" width="250" height="44" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="590" y="516" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Надіслати POST /api/posts</text>
  <text x="590" y="532" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">із заголовком Authorization</text>

  <!-- Потік до Бекенд Сервера -->
  <line x1="715" y1="519" x2="848" y2="519" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <rect x="850" y="497" width="240" height="44" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="970" y="516" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Перевірити JWT-токен</text>
  <text x="970" y="532" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">(verifyToken middleware)</text>

  <line x1="970" y1="541" x2="970" y2="566" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <!-- Decision 3: Токен дійсний? -->
  <polygon points="970,568 1048,596 970,624 892,596" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="970" y="600" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Токен дійсний?</text>

  <!-- Гілка [ні] -> Повернути 401 -->
  <line x1="892" y1="596" x2="717" y2="596" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <text x="868" y="588" font-size="11.5" font-weight="600" fill="#111827">ні</text>

  <rect x="465" y="574" width="250" height="44" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="590" y="593" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Обробити помилку 401</text>
  <text x="590" y="609" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">та скинути прострочену сесію</text>

  <line x1="465" y1="596" x2="432" y2="596" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <use href="#final-node" x="417" y="596"/>

  <!-- Гілка [так] -> FORK (паралельний запис у БД) -->
  <line x1="970" y1="624" x2="970" y2="652" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <text x="982" y="642" font-size="11.5" font-weight="600" fill="#111827">так</text>

  <!-- Fork Node (товста горизонтальна лінія) -->
  <rect x="835" y="654" width="270" height="6" fill="#111827"/>

  <line x1="890" y1="660" x2="890" y2="686" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <line x1="1050" y1="660" x2="1050" y2="686" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <!-- Паралельна дія 1 -->
  <rect x="802" y="688" width="162" height="50" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="883" y="710" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">Зберегти публікацію</text>
  <text x="883" y="726" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">у таблицю posts</text>

  <!-- Паралельна дія 2 -->
  <rect x="976" y="688" width="166" height="50" rx="10" ry="10" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="1059" y="710" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">Зберегти зв'язки у</text>
  <text x="1059" y="726" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">post_categories</text>

  <line x1="890" y1="738" x2="890" y2="764" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <line x1="1050" y1="738" x2="1050" y2="764" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <!-- Join Node (товста горизонтальна лінія) -->
  <rect x="835" y="766" width="270" height="6" fill="#111827"/>

  <line x1="970" y1="772" x2="970" y2="796" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <!-- Повернути 201 Created -->
  <rect x="850" y="798" width="240" height="44" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="970" y="817" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Повернути відповідь</text>
  <text x="970" y="833" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">201 Created (postId)</text>

  <!-- Потік назад у Redux Store -->
  <line x1="850" y1="820" x2="717" y2="820" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <rect x="465" y="798" width="250" height="44" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="590" y="817" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Оновити стан postsSlice</text>
  <text x="590" y="833" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">та очистити чернетку</text>

  <!-- Потік у UI Користувача -->
  <line x1="465" y1="820" x2="347" y2="820" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <rect x="95" y="798" width="250" height="44" rx="12" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="220" y="817" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">Відобразити тост успіху</text>
  <text x="220" y="833" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">та нове питання у стрічці</text>

  <line x1="95" y1="820" x2="68" y2="820" stroke="#111827" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <use href="#final-node" x="53" y="820"/>

  <!-- Підпис рисунка -->
  <text x="600" y="898" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">
    Рисунок 4 — Діаграма діяльності (Activity Diagram) процесу створення публікації
  </text>
</svg>
